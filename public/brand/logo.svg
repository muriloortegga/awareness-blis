<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 95 36" width="95" height="36">
  <!-- 
    blis Wordmark Logo
    
    This logo uses SVG elements to combine standard text styling with a custom green dot 
    on the "i", adhering strictly to the brand guidelines.
    
    The main characters ("bl", the stem of "i", and "s") inherit "currentColor" so they 
    automatically switch colors (e.g. charcoal on light backgrounds, white on dark).
    The dot of the "i" is locked to the brand green (#1FA34A).
  -->
  <g font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" letter-spacing="-0.04em">
    <!-- Letters "bl" -->
    <text x="0" y="27" fill="currentColor">bl</text>
    
    <!-- Custom dotless stem for "i" to allow separate color for the dot -->
    <rect x="29.5" y="13.5" width="4" height="13.5" rx="0.8" fill="currentColor" />
    
    <!-- Brand green dot for the "i" -->
    <circle cx="31.5" cy="7.5" r="2.3" fill="#1FA34A" />
    
    <!-- Letter "s" -->
    <text x="35.5" y="27" fill="currentColor">s</text>
  </g>
</svg>
